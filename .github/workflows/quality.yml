name: Quality gate

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or ref to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      APP_URL: https://help-bloomery.test
      APP_DOMAIN: casual.help-bloomery.test
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      R2_ACCESS_KEY_ID: testing
      R2_SECRET_ACCESS_KEY: testing
      R2_BUCKET: testing
      R2_ENDPOINT: https://testing.invalid
      RND_PROJECT_TASK_ATTACHMENT_DISK: b2
      ESB_CORE_USERNAME: testing
      ESB_CORE_PASSWORD: testing
      ESB_MASTER_PRODUCT_TOKEN: testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Create environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run unit tests
        run: php artisan test --compact --testsuite=Unit

      - name: Run feature tests in bounded batches
        shell: bash
        run: |
          mapfile -d '' feature_tests < <(find tests/Feature -type f -name '*.php' -print0 | sort -z)
          batch_size=20

          for ((start = 0; start < ${#feature_tests[@]}; start += batch_size)); do
            batch=("${feature_tests[@]:start:batch_size}")
            echo "Running feature-test batch starting at index ${start} (${#batch[@]} files)..."
            php artisan test --compact "${batch[@]}"
          done
