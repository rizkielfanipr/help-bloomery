name: Deploy Help Bloomery to cPanel

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP & Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      # 3. Prepare build environment
      - name: Prepare build environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          touch database/database.sqlite

      # 4. Install Laravel dependencies (production mode)
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      # 5. Generate app key
      - name: Generate app key
        run: php artisan key:generate --no-interaction

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 7. Install frontend deps & build assets
      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      # 8. Hapus .env build sementara
      - name: Remove build .env
        run: rm -f .env database/database.sqlite

      # 9. Deploy via FTPS
      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ github.ref_name == 'staging'
            && '/public_html/stg.helpbloomery/'
            || '/public_html/helpbloomery/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/*.php
            **/*.log
            **/.DS_Store
            **/database/database.sqlite
