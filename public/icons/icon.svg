<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192">
  <style>
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark  { display: block; }
    }
    @media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) {
      .light { display: block; }
      .dark  { display: none; }
    }
  </style>
  <image class="light" href="/icons/icon-192.png"      width="192" height="192"/>
  <image class="dark"  href="/icons/icon-192-dark.png" width="192" height="192"/>
</svg>
