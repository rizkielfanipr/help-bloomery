name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA that has passed UAT on staging
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm the production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-request:
    name: Validate deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Require explicit confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$DEPLOY_CONFIRMATION" != 'DEPLOY' ]]; then
            echo 'Production deployment cancelled: confirmation must be exactly DEPLOY.'
            exit 1
          fi

      - name: Check out main history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit is on main
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Commit SHA must contain exactly 40 hexadecimal characters.'
            exit 1
          fi

          resolved_sha="$(git rev-parse --verify "${REQUESTED_SHA}^{commit}")"

          if ! git merge-base --is-ancestor "$resolved_sha" origin/main; then
            echo 'The requested commit is not part of origin/main.'
            exit 1
          fi

          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gate
    needs: validate-request
    uses: ./.github/workflows/quality.yml
    with:
      checkout_ref: ${{ needs.validate-request.outputs.commit_sha }}

  deploy-production:
    name: Deploy production
    needs:
      - validate-request
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: bloomery-vps-deployment
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy approved staging commit to production
        env:
          DEPLOY_SHA: ${{ needs.validate-request.outputs.commit_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "deploy production $DEPLOY_SHA"
