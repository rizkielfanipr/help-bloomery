name: Deploy Help Bloomery to cPanel

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP & Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      # 3. Install Laravel dependencies (production mode)
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 5. Install frontend deps & build assets
      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      # 6. Safety check (pastikan .env tidak ikut)
      - name: Safety check (.env)
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file detected. Do NOT commit .env to git."
            exit 1
          fi

      # 7. Deploy via FTP (branch-based)
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: ./

          # staging -> public_html/stg.helpbloomery
          # main    -> public_html/helpbloomery
          server-dir: ${{ github.ref_name == 'staging'
            && '/public_html/stg.helpbloomery/'
            || '/public_html/helpbloomery/' }}

          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/*.php
            **/*.log
            **/.DS_Store
