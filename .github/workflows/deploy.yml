name: Test and deploy

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      APP_URL: https://help-bloomery.test
      APP_DOMAIN: casual.help-bloomery.test
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      R2_ACCESS_KEY_ID: testing
      R2_SECRET_ACCESS_KEY: testing
      R2_BUCKET: testing
      R2_ENDPOINT: https://testing.invalid
      RND_PROJECT_TASK_ATTACHMENT_DISK: b2
      ESB_CORE_USERNAME: testing
      ESB_CORE_PASSWORD: testing
      ESB_MASTER_PRODUCT_TOKEN: testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Create environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run unit tests
        run: php artisan test --compact --testsuite=Unit

      - name: Run feature tests in bounded batches
        shell: bash
        run: |
          mapfile -d '' feature_tests < <(find tests/Feature -type f -name '*.php' -print0 | sort -z)
          batch_size=20

          for ((start = 0; start < ${#feature_tests[@]}; start += batch_size)); do
            batch=("${feature_tests[@]:start:batch_size}")
            echo "Running feature-test batch starting at index ${start} (${#batch[@]} files)..."
            php artisan test --compact "${batch[@]}"
          done

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: bloomery-vps-deployment
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy selected environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          case "$GITHUB_REF_NAME" in
            main)
              deploy_command='deploy production'
              ;;
            staging)
              deploy_command='deploy staging'
              ;;
            *)
              echo "Unsupported deployment branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "$deploy_command"
