name: Deploy Help Bloomery to cPanel

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP & Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      # 3. Prepare build environment (.env sementara agar package:discover tidak error)
      - name: Prepare build environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          touch database/database.sqlite

      # 4. Install Laravel dependencies (production mode)
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      # 5. Generate app key (vendor sudah tersedia)
      - name: Generate app key
        run: php artisan key:generate --no-interaction

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 7. Install frontend deps & build assets
      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      # 8. Hapus .env build sementara sebelum deploy
      - name: Remove build .env
        run: rm -f .env database/database.sqlite

      # 9. Deploy via rsync over SSH (branch-based)
      - name: Deploy to cPanel via SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude='.git'
            --exclude='.github'
            --exclude='.env'
            --exclude='.env.*'
            --exclude='node_modules'
            --exclude='tests'
            --exclude='storage/logs'
            --exclude='storage/framework/cache'
            --exclude='storage/framework/sessions'
            --exclude='storage/framework/views'
            --exclude='bootstrap/cache/*.php'
            --exclude='*.log'
            --exclude='.DS_Store'
            --exclude='database/database.sqlite'
          path: ./
          remote_path: ${{ github.ref_name == 'staging'
            && '/public_html/stg.helpbloomery/'
            || '/public_html/helpbloomery/' }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASSWORD }}
          remote_port: 2222
