name: Deploy Help Bloomery

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$(pwd)/database/database.sqlite|" .env
          touch database/database.sqlite

      - name: Install Composer
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: rm -f .env database/database.sqlite

      - name: Archive
        run: |
          zip -qr release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "database/database.sqlite" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/views/*" \
            -x "storage/framework/sessions/*"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.zip

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Deploy
        shell: bash
        run: |

          set -e

          if [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_DIR="$HOME/public_html/helpbloomery"
          else
            DEPLOY_DIR="$HOME/public_html/stg.helpbloomery"
          fi

          mkdir -p "$DEPLOY_DIR"

          TMP=$(mktemp -d)

          unzip -q release.zip -d "$TMP"

          rm -f "$TMP/.env"

          if [ -d "$DEPLOY_DIR/storage" ]; then
            rm -rf "$TMP/storage"
          fi

          rsync -a --delete \
            --exclude=.env \
            "$TMP"/ "$DEPLOY_DIR"/

          cd "$DEPLOY_DIR"

          php artisan optimize:clear

          php artisan optimize

          rm -rf "$TMP"

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE"/*